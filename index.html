<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔐 私人小站</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --txt:#e8edf5; --mut:#8b96ad; --acc:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
         min-height:100vh; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--card); border-radius:14px; padding:28px; width:100%; max-width:380px;
          box-shadow:0 4px 24px rgba(0,0,0,.35); text-align:center; }
  .card h1 { font-size:20px; margin:0 0 6px; }
  .card p { color:var(--mut); font-size:13px; margin:0 0 16px; }
  input[type=password] { width:100%; background:#0d1320; color:var(--txt); border:1px solid #2c3852;
      border-radius:8px; padding:11px 12px; font-size:15px; text-align:center; letter-spacing:1px; }
  input:focus { outline:none; border-color:var(--acc); }
  .btn { display:block; width:100%; background:var(--acc); color:#fff; border:0; border-radius:8px;
         padding:11px; font-size:15px; cursor:pointer; margin-top:12px; }
  .btn:hover { filter:brightness(1.12); }
  #gateMsg { font-size:13px; color:#ff8f8f; min-height:20px; margin-top:10px; }
  .hidden { display:none !important; }
  /* ---- 內容區 ---- */
  .wrap { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  .hero { text-align:center; margin-bottom:28px; }
  .hero h1 { font-size:26px; margin:0 0 8px; }
  .hero p { color:var(--mut); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .tile { background:var(--card); border-radius:12px; padding:20px; }
  .tile h2 { font-size:16px; margin:0 0 8px; }
  .tile p { color:var(--mut); font-size:13px; line-height:1.7; margin:0; }
  .foot { text-align:center; color:var(--mut); font-size:12px; margin-top:40px; }
  .foot button { background:none; border:1px solid #2c3852; color:var(--mut); border-radius:6px;
                 padding:6px 12px; font-size:12px; cursor:pointer; margin-top:8px; }
</style>
</head>
<body>

<!-- 密碼門 -->
<div id="gate" class="center">
  <div class="card">
    <h1>🔐 私人小站</h1>
    <p>請輸入密碼進入</p>
    <input type="password" id="pw" placeholder="密碼" autocomplete="off"
           onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()">進入</button>
    <div id="gateMsg"></div>
  </div>
</div>

<!-- 內容 -->
<div id="content" class="hidden">
  <div class="wrap">
    <div class="hero">
      <h1>👋 歡迎回來</h1>
      <p>這是你的私人小站起始頁。告訴我你想放什麼，我幫你換上真正的內容。</p>
    </div>
    <div class="grid">
      <div class="tile"><h2>📌 區塊一</h2><p>預留位置。可以放公告、連結、筆記入口。</p></div>
      <div class="tile"><h2>📊 區塊二</h2><p>預留位置。可以放數據、圖表、追蹤表。</p></div>
      <div class="tile"><h2>📝 區塊三</h2><p>預留位置。可以放文章、想法、待辦。</p></div>
    </div>
    <div class="foot">
      簡易密碼門（擋路人等級）· 同一瀏覽器 session 內免重複輸入
      <br><button onclick="lock()">鎖定</button>
    </div>
  </div>
</div>

<script>
/* 密碼的 SHA-256 hash。想換密碼：把新密碼的 sha256 貼到這裡即可。 */
const PASS_HASH = "1129b21a2ed9ea752cdfb776cc6fc7f8855b7345f27fc25cad9e3c5fbf14026f";

async function sha256Hex(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function showContent() {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("content").classList.remove("hidden");
}
async function unlock() {
  const v = document.getElementById("pw").value;
  const msg = document.getElementById("gateMsg");
  if (!v) { msg.textContent = "請輸入密碼"; return; }
  msg.textContent = "驗證中…";
  const h = await sha256Hex(v);
  if (h === PASS_HASH) {
    sessionStorage.setItem("pv_auth", "1");
    document.getElementById("pw").value = "";
    msg.textContent = "";
    showContent();
  } else {
    msg.textContent = "密碼錯誤，再試一次";
  }
}
function lock() {
  sessionStorage.removeItem("pv_auth");
  document.getElementById("content").classList.add("hidden");
  document.getElementById("gate").classList.remove("hidden");
}
if (sessionStorage.getItem("pv_auth") === "1") showContent();
</script>
</body>
</html>
